{% extends "base.html" %}{% block title %}Sign in{% endblock %}
{% block body %}
<section style="max-width:380px;margin:40px auto">
<h1>{{ game['name'] }}</h1>
<p class="sub">Sign in with the username and password your instructor gave you.</p>
<form method="post">
<div class="field"><label for="u">Username</label>
<input id="u" name="username" autocomplete="username" autofocus required></div>
<div class="field"><label for="p">Password</label>
<input id="p" name="password" type="password" autocomplete="current-password" required></div>
<button type="submit">Sign in</button>
</form></section>
{% endblock %}
